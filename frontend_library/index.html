<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A curated library of digital UI/UX designs that adapt physical real-world objects and tactile artifacts." />
  <title>Physical UI Metaphor Library</title>

  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="site-header__inner">
        <div>
          <h1 class="site-header__title">Physical UI <span>Metaphor Library</span></h1>
          <p class="site-header__description">
            A curated index of digital UI/UX designs that adapt real-world physical objects,
            tactile artifacts, and print ephemera into interactive interfaces.
          </p>
        </div>
        <div class="search-bar">
          <span class="search-bar__icon" aria-hidden="true">⌕</span>
          <input
            id="search-input"
            class="search-bar__input"
            type="search"
            placeholder="Search by title, style, component…"
            aria-label="Search references"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <!-- Tier 1: Category Tab Navigation -->
      <div class="nav-tabs-bar">
        <div id="category-tabs" class="nav-tabs" role="tablist" aria-label="Filter category tabs"></div>
        <span id="results-count" class="results-count" aria-live="polite"></span>
      </div>

      <!-- Tier 2: Sub-filter Pills (Contextual to selected tab) -->
      <div id="sub-filter-row" class="sub-filter-row" style="display: none;">
        <div class="sub-filter-header">
          <span id="sub-filter-title" class="sub-filter-title">Filter by Tag</span>
        </div>
        <div id="filter-pills" class="filter-pills" role="group" aria-label="Filter by tag"></div>
      </div>
    </div>

    <div id="gallery" class="gallery-grid" role="list" aria-label="Reference entries">
      <!-- Cards injected by app.js -->
      <div class="skeleton" style="height:220px;border-radius:12px;"></div>
      <div class="skeleton" style="height:220px;border-radius:12px;"></div>
      <div class="skeleton" style="height:220px;border-radius:12px;"></div>
    </div>
  </main>

  <script type="module" src="assets/js/utils.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
